<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a37" />
    <title>Ping</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Ping</h1>
      <span id="who" class="who"></span>
    </header>

    <div id="notice" class="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="notice-action" type="button" hidden></button>
    </div>

    <main>
      <form id="new-note" class="new-note" autocomplete="off">
        <textarea id="new-note-text" rows="2" maxlength="2000" placeholder="Escribí una nota…" aria-label="Nueva nota" required></textarea>
        <button type="submit">Anotar</button>
      </form>

      <p id="empty" class="empty" hidden>Todavía no hay notas.</p>
      <ul id="list" class="list"></ul>
    </main>

    <template id="note-template">
      <li class="note">
        <p class="text"></p>
        <div class="meta">
          <span class="date"></span>
          <span class="status"></span>
          <span class="actions">
            <button type="button" class="edit">Editar</button>
            <button type="button" class="delete">Borrar</button>
          </span>
        </div>
      </li>
    </template>
  </body>
</html>
